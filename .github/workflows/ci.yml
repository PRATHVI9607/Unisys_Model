name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - run: uv sync --frozen --all-extras   # tests import every component
      - run: uv run --all-extras ruff check .
      - run: uv run --all-extras pytest

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (no push)
        run: |
          for img in inference agents dashboard chaos; do
            docker build -t "kubeheal/$img:ci" -f "deploy/docker/Dockerfile.$img" .
          done
