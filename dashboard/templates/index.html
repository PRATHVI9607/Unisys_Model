<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeHeal — Autonomous Remediation Console</title>
    <link rel="stylesheet" href="/static/event-details.css">
    <style>
        /* ============================================================
           KubeHeal Console — warm-paper theme.
           Vanilla CSS, no build step. Single locked light theme.
           Risk encoded in a warm scale (sage / amber / rust), never neon.
           ============================================================ */
        :root {
            --bg:            #F0EEE6;
            --surface:       #FAF9F5;
            --surface-2:     #F4F2EA;
            --ink:           #1F1E1C;
            --ink-soft:      #6B6862;
            --ink-faint:     #94908A;
            --border:        #E4E0D4;
            --border-strong: #D6D0C0;
            --clay:          #C96442;  /* clay — single accent */
            --clay-deep:     #A84F33;
            --clay-wash:     #F1E3DC;
            --sage:          #5E8C5A;  /* low risk */
            --amber:         #BE8A2E;  /* medium risk */
            --rust:          #BC4B3C;  /* high / critical risk */
            --sage-wash:     #E7EEE3;
            --amber-wash:    #F3E9D2;
            --rust-wash:     #F2DED9;
            --radius:        12px;
            --radius-sm:     8px;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
            --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--ink);
            min-height: 100dvh;
            line-height: 1.5;
        }

        .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 28px 64px; }

        /* ---- Top bar ---------------------------------------------- */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 22px; margin-bottom: 26px;
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 13px; }
        .brand .mark {
            width: 38px; height: 38px; border-radius: 10px;
            background: var(--clay); color: #fff;
            display: grid; place-items: center; flex-shrink: 0;
            box-shadow: 0 1px 0 rgba(0,0,0,.04), inset 0 1px 0 rgba(255,255,255,.18);
        }
        .brand .mark svg { width: 22px; height: 22px; }
        .brand h1 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
        .brand .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }

        .conn {
            display: flex; align-items: center; gap: 9px;
            font-size: 13px; color: var(--ink-soft);
            background: var(--surface); border: 1px solid var(--border);
            padding: 7px 13px; border-radius: 999px;
        }
        .conn .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--sage); position: relative;
        }
        .conn .dot::after {
            content: ""; position: absolute; inset: -4px; border-radius: 50%;
            background: var(--sage); opacity: .35;
            animation: ping 2s cubic-bezier(0,0,.2,1) infinite;
        }
        .conn .dot.disconnected { background: var(--rust); }
        .conn .dot.disconnected::after { display: none; }
        @keyframes ping { 0% { transform: scale(1); opacity: .35; } 70%,100% { transform: scale(2.4); opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .conn .dot::after { animation: none; } }

        /* ---- KPI strip -------------------------------------------- */
        .kpis {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 1px; background: var(--border);
            border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; margin-bottom: 26px;
        }
        .kpi { background: var(--surface); padding: 18px 20px; }
        .kpi .label {
            font-size: 11.5px; font-weight: 500; color: var(--ink-soft);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
        }
        .kpi .value { font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
        .kpi .value.alert { color: var(--rust); }
        .kpi .foot { font-size: 11.5px; color: var(--ink-faint); margin-top: 4px; }

        /* ---- Panels ----------------------------------------------- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        .panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            display: flex; flex-direction: column;
        }
        .panel-head {
            display: flex; align-items: center; gap: 9px;
            padding: 14px 18px; border-bottom: 1px solid var(--border);
            background: var(--surface-2);
        }
        .panel-head .ico { width: 17px; height: 17px; color: var(--ink-soft); flex-shrink: 0; }
        .panel-head h2 { font-size: 14px; font-weight: 600; letter-spacing: -.005em; }
        .panel-head .tally {
            margin-left: auto; font-family: var(--mono); font-size: 12px;
            color: var(--ink-soft); background: var(--bg);
            border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px;
        }
        .feed { padding: 8px; overflow-y: auto; max-height: 430px; }

        /* ---- Event rows ------------------------------------------- */
        .row {
            display: grid; grid-template-columns: auto 1fr auto;
            align-items: center; gap: 13px;
            padding: 12px 12px; border-radius: var(--radius-sm);
            cursor: pointer; transition: background .14s ease;
            animation: rise .26s cubic-bezier(.16,1,.3,1);
        }
        .row:hover { background: var(--surface-2); }
        .row + .row { border-top: 1px solid var(--border); }
        @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .row { animation: none; } }

        .swatch {
            width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
            display: grid; place-items: center;
        }
        .swatch svg { width: 17px; height: 17px; }
        .swatch.health { background: var(--clay-wash); color: var(--clay-deep); }
        .swatch.security { background: var(--rust-wash); color: var(--rust); }

        .row .body { min-width: 0; }
        .row .target {
            font-size: 13.5px; font-weight: 550; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .row .meta {
            display: flex; align-items: center; gap: 8px; margin-top: 3px;
            font-size: 12px; color: var(--ink-soft);
        }
        .row .meta .tag {
            font-family: var(--mono); font-size: 11px;
            color: var(--ink-soft); background: var(--bg);
            border: 1px solid var(--border); padding: 1px 7px; border-radius: 5px;
            white-space: nowrap;
        }
        .row .meta .time { font-variant-numeric: tabular-nums; color: var(--ink-faint); }

        .right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .pill {
            font-family: var(--mono); font-size: 12px; font-weight: 600;
            padding: 3px 9px; border-radius: 999px; white-space: nowrap;
        }
        .pill.low    { background: var(--sage-wash);  color: var(--sage); }
        .pill.medium { background: var(--amber-wash); color: var(--amber); }
        .pill.high   { background: var(--rust-wash);  color: var(--rust); }
        .bar { width: 64px; height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; }
        .bar > i { display: block; height: 100%; border-radius: 999px; }
        .bar > i.low { background: var(--sage); }
        .bar > i.medium { background: var(--amber); }
        .bar > i.high { background: var(--rust); }

        /* ---- Empty / loading -------------------------------------- */
        .empty { text-align: center; padding: 46px 20px; color: var(--ink-faint); }
        .empty svg { width: 30px; height: 30px; opacity: .5; margin-bottom: 12px; }
        .empty p { font-size: 13.5px; }
        .empty .hint { font-size: 12px; margin-top: 5px; color: var(--ink-faint); }
        .skel { padding: 12px; }
        .skel .line {
            height: 46px; border-radius: var(--radius-sm); margin-bottom: 8px;
            background: linear-gradient(90deg, var(--surface-2) 25%, var(--bg) 37%, var(--surface-2) 63%);
            background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
        }
        @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        @media (prefers-reduced-motion: reduce) { .skel .line { animation: none; } }

        /* ---- Actions + row extras -------------------------------- */
        .actions { margin-bottom: 20px; }
        .actions .feed { max-height: 560px; }
        .swatch.action { background: var(--amber-wash); color: var(--amber); }
        .row:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
        .row .meta { flex-wrap: wrap; }
        .row .meta .tag.dry { background: var(--amber-wash); color: var(--amber); border-color: transparent; }
        .row .meta .tag.warn { background: var(--rust-wash); color: var(--rust); border-color: transparent; }
        .row .summary {
            font-size: 12.5px; color: var(--ink-soft); margin-top: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .right .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

        /* ---- Scrollbar -------------------------------------------- */
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--surface); }
        ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

        @media (max-width: 1024px) {
            .kpis { grid-template-columns: repeat(2, 1fr); }
            .grid-2 { grid-template-columns: 1fr; }
        }
        @media (max-width: 560px) {
            .wrap { padding: 18px 16px 48px; }
            .kpis { grid-template-columns: 1fr; }
            .conn .label-text { display: none; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="topbar">
            <div class="brand">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.5 4 6v5.5c0 4.5 3.2 8.3 8 9.8 4.8-1.5 8-5.3 8-9.8V6l-8-3.5Z"/>
                        <path d="M9 12.2 11.2 14.4 15.2 9.6"/>
                    </svg>
                </span>
                <div>
                    <h1>KubeHeal</h1>
                    <div class="sub">Autonomous health &amp; security remediation</div>
                </div>
            </div>
            <div class="conn" role="status" aria-live="polite">
                <span class="dot disconnected" id="connectionDot"></span>
                <span class="label-text" id="connectionText">Connecting</span>
            </div>
        </header>

        <section class="kpis" aria-label="Summary metrics">
            <div class="kpi">
                <div class="label">Actions</div>
                <div class="value" id="kpiActions">—</div>
                <div class="foot" id="kpiActionsFoot">fusion decisions</div>
            </div>
            <div class="kpi">
                <div class="label">Health assessments</div>
                <div class="value" id="kpiHealth">—</div>
                <div class="foot" id="kpiHealthFoot">spec drift</div>
            </div>
            <div class="kpi">
                <div class="label">Security windows</div>
                <div class="value" id="kpiSecurity">—</div>
                <div class="foot" id="kpiSecurityFoot">syscall &amp; entropy</div>
            </div>
            <div class="kpi">
                <div class="label">High-risk events</div>
                <div class="value alert" id="kpiHighRisk">—</div>
                <div class="foot">risk ≥ 70%, health + security</div>
            </div>
        </section>

        <section class="panel actions">
            <div class="panel-head">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
                <h2>Actions</h2>
                <span class="tally" id="actionTally">0</span>
            </div>
            <div class="feed" id="actionEvents" data-kind="action"></div>
        </section>

        <div class="grid-2">
            <section class="panel">
                <div class="panel-head">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5 7 5-14L17 12h4"/></svg>
                    <h2>Health assessments</h2>
                    <span class="tally" id="healthTally">0</span>
                </div>
                <div class="feed" id="healthEvents" data-kind="health"></div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                    <h2>Security events</h2>
                    <span class="tally" id="securityTally">0</span>
                </div>
                <div class="feed" id="securityEvents" data-kind="security"></div>
            </section>
        </div>
    </div>

    <script src="/static/event-details.js"></script>
    <script>
        // Every value from the API goes through esc(); ids travel in data-* attributes, never inline JS.
        const KINDS = ['action', 'health', 'security'];
        const MAX_ROWS = 50;
        const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
        const ICON = {
            action: SVG('<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>'),
            health: SVG('<path d="M3 12h4l2.5 7 5-14L17 12h4"/>'),
            security: SVG('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
            quiet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5 11 15l4.5-5.5"/></svg>'
        };
        const EMPTY = {
            action: ['No actions yet', 'Fusion decisions land here, dry-run ones included'],
            health: ['No health assessments yet', 'Published when a workload spec actually changes'],
            security: ['No security events yet', 'Published per pod syscall / entropy window'],
        };

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const isNum = v => typeof v === 'number' && Number.isFinite(v);
        const dash = v => (v === null || v === undefined || v === '') ? '—' : v;
        const pct = v => isNum(v) ? `${Math.round(v * 100)}%` : '—';
        const riskClass = v => !isNum(v) ? 'low' : v >= 0.7 ? 'high' : v >= 0.4 ? 'medium' : 'low';
        const pretty = s => s ? String(s).replace(/_/g, ' ') : '—';
        const fmtTime = ms => isNum(ms) && ms > 0
            ? new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
        const target = e => `${dash(e.namespace)}/${dash(e.workload)}${e.pod ? ` · ${e.pod}` : ''}`;
        const tag = (text, cls = '') => `<span class="tag ${cls}">${esc(text)}</span>`;
        const $ = id => document.getElementById(id);
        const feedEl = kind => document.querySelector(`.feed[data-kind="${kind}"]`);

        function windowText(e) {
            const s = e.window_end_ms - e.window_start_ms;
            return isNum(s) && e.window_start_ms > 0 && s >= 0 ? `${Math.round(s / 1000)}s window` : 'window —';
        }

        function row(e) {
            const k = e.kind;
            let tags, extra = '', right;
            if (k === 'action') {
                tags = [tag(pretty(e.decision)), e.mode === 'observe' ? tag('dry-run', 'dry') : '',
                        tag(pretty(e.outcome), String(e.outcome || '').startsWith('failed') ? 'warn' : '')];
                extra = `<div class="summary">${esc(e.summary || e.rationale || '—')}</div>`;
                right = `<span class="pill ${riskClass(e.score)}">${pct(e.score)}</span>
                         <span class="sub">compound ${pct(e.compound_score)}</span>`;
            } else {
                tags = [tag(pretty(e.label)), e.uncertain ? tag('uncertain', 'dry') : '',
                        k === 'health' ? tag(`${(e.changed_fields || []).length} fields changed`)
                                       : tag(`${dash(e.n_events)} events · ${windowText(e)}`),
                        ...(e.failure_reasons || []).map(r => tag(r, 'warn'))];
                const rc = riskClass(e.risk), w = isNum(e.risk) ? Math.max(6, Math.round(e.risk * 100)) : 0;
                right = `<span class="pill ${rc}">${pct(e.risk)}</span>
                         <span class="bar"><i class="${rc}" style="width:${w}%"></i></span>`;
            }
            return `
                <div class="row" tabindex="0" role="button" data-kind="${esc(k)}" data-id="${esc(e.event_id)}">
                    <span class="swatch ${esc(k)}">${ICON[k] || ''}</span>
                    <div class="body">
                        <div class="target">${esc(target(e))}</div>
                        <div class="meta">${tags.join('')}<span class="time">${fmtTime(e.timestamp_ms)}</span></div>
                        ${extra}
                    </div>
                    <div class="right">${right}</div>
                </div>`;
        }

        function emptyState(kind) {
            const [msg, hint] = EMPTY[kind];
            return `<div class="empty">${ICON.quiet}<p>${esc(msg)}</p><div class="hint">${esc(hint)}</div></div>`;
        }

        function render(kind, events) {   // events newest first
            const el = feedEl(kind);
            el.innerHTML = events.length ? events.slice(0, MAX_ROWS).map(row).join('') : emptyState(kind);
        }

        function prepend(kind, events) {  // events newest first; skips rows already shown
            const el = feedEl(kind);
            const fresh = events.filter(e => !el.querySelector(`.row[data-id="${CSS.escape(String(e.event_id))}"]`));
            if (!fresh.length) return;
            if (!el.querySelector('.row')) el.innerHTML = '';
            el.insertAdjacentHTML('afterbegin', fresh.map(row).join(''));
            while (el.children.length > MAX_ROWS) el.lastElementChild.remove();
        }

        let wsUp = false, redisUp = true;
        function setConn() {
            const ok = wsUp && redisUp;
            $('connectionDot').classList.toggle('disconnected', !ok);
            $('connectionText').textContent = !wsUp ? 'Reconnecting' : redisUp ? 'Live' : 'Redis unavailable';
        }

        function setStats(s) {
            if (!s) return;
            $('kpiActions').textContent = s.actions ?? '—';
            $('kpiActionsFoot').textContent = `${s.actions_dry_run ?? 0} dry-run · last ${s.window ?? '—'}`;
            $('kpiHealth').textContent = s.health_events ?? '—';
            $('kpiHealthFoot').textContent = `${s.health_high_risk ?? 0} high-risk · last ${s.window ?? '—'}`;
            $('kpiSecurity').textContent = s.security_events ?? '—';
            $('kpiSecurityFoot').textContent = `${s.security_high_risk ?? 0} high-risk · last ${s.window ?? '—'}`;
            $('kpiHighRisk').textContent = (s.health_high_risk ?? 0) + (s.security_high_risk ?? 0);
            $('actionTally').textContent = s.actions ?? 0;
            $('healthTally').textContent = s.health_events ?? 0;
            $('securityTally').textContent = s.security_events ?? 0;
            redisUp = s.redis_connected !== false;
            setConn();
        }

        async function getJSON(url) {
            const r = await fetch(url);
            if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
            return r.json();
        }

        // WS events that arrive while a full load is in flight wait for it, then dedupe against it.
        let loading = null;
        function loadAll() {
            const p = Promise.all([
                getJSON('/api/stats').then(setStats),
                ...KINDS.map(k => getJSON(`/api/events?kind=${k}&limit=${MAX_ROWS}`).then(d => render(k, d.events || []))),
            ]).catch(err => console.error('load failed', err));
            loading = p;
            p.finally(() => { if (loading === p) loading = null; });
            return p;
        }

        let attempts = 0;
        function connect() {
            const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`);
            ws.onopen = () => { attempts = 0; wsUp = true; setConn(); loadAll(); };
            ws.onmessage = async m => {
                let msg;
                try { msg = JSON.parse(m.data); } catch { return; }
                if (msg.stats) setStats(msg.stats);
                if (msg.type === 'resync') return loadAll();
                if (msg.type === 'events' && Array.isArray(msg.events)) {
                    if (loading) await loading;
                    for (const k of KINDS) prepend(k, msg.events.filter(e => e.kind === k).reverse());
                }
            };
            ws.onclose = () => {   // retry forever, capped exponential backoff
                wsUp = false; setConn();
                setTimeout(connect, Math.min(1000 * 2 ** attempts++, 30000));
            };
        }

        for (const kind of KINDS) {
            const el = feedEl(kind);
            el.innerHTML = '<div class="skel">' + '<div class="line"></div>'.repeat(4) + '</div>';
            const openRow = ev => {
                const r = ev.target.closest('.row');
                if (r) openEventDetails(r.dataset.kind, r.dataset.id);
            };
            el.addEventListener('click', openRow);
            el.addEventListener('keydown', ev => {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openRow(ev); }
            });
        }
        loadAll();   // also covers a proxy that blocks WebSockets
        connect();
    </script>
</body>
</html>
