<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>KubeHeal console</title>
<link rel="stylesheet" href="/static/console.css">
<script type="module" src="/static/main.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4 6v5.5c0 4.5 3.2 8.3 8 9.8 4.8-1.5 8-5.3 8-9.8V6l-8-3.5Z"/><path d="m9 12.2 2.2 2.2 4-4.8"/></svg>
      <span>KubeHeal</span>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div id="who" class="who"></div>
      <button type="button" id="theme" class="quiet">Theme</button>
    </div>
  </aside>
  <div class="content">
    <div id="modebar" class="modebar" role="status"></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="announce" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
