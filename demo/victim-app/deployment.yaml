apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-app
  namespace: prod
  labels:
    app.kubernetes.io/name: victim-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victim-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victim-app
        kubeheal.io/scrape: "true"
    spec:
      containers:
        - name: victim-app
          image: kubeheal-victim-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
