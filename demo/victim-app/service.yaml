apiVersion: v1
kind: Service
metadata:
  name: victim-app
  namespace: prod
  labels:
    app.kubernetes.io/name: victim-app
    kubeheal.io/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: victim-app
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: victim-app
  namespace: dev
  labels:
    app.kubernetes.io/name: victim-app
    kubeheal.io/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: victim-app
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
