{{- /*
Health agent, security agent (DaemonSet), fusion agent (2 replicas), executor, dashboard.
Every component reaches Redis through REDIS_URL with the password from the Secret (no agent code change).
Requests and limits are rendered only when set in values.
*/ -}}
{{- $ns := include "kubeheal.namespace" . }}
{{- $g := .Values.global }}
{{- $ha := .Values.healthAgent }}
apiVersion: v1
kind: Service
metadata:
  name: health-agent
  namespace: {{ $ns }}
  labels: {app: health-agent}
spec:
  ports: [{port: {{ $ha.port }}, targetPort: {{ $ha.port }}, protocol: TCP}]
  selector: {app: health-agent}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-agent
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: health-agent}
  template:
    metadata:
      labels: {app: health-agent}
      annotations:
        {{- include "kubeheal.scrapeAnnotations" (dict "port" $ha.port) | nindent 8 }}
    spec:
      serviceAccountName: health-agent
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "kubeheal.image" (dict "root" . "image" $ha.image) | quote }}
          imagePullPolicy: {{ $g.imagePullPolicy }}
          ports:
            - {containerPort: {{ $ha.port }}, name: http}
          env:
            {{- include "kubeheal.redisEnv" . | nindent 12 }}
            - {name: HEALTH_MODEL_URL, value: "http://{{ .Values.modelServers.health.name }}:{{ .Values.modelServers.health.port }}"}
            - {name: PROMETHEUS_URL, value: {{ $ha.prometheusUrl | quote }}}
            - {name: NAMESPACE, value: {{ $ns | quote }}}
            - {name: LOG_LEVEL, value: {{ $ha.logLevel | quote }}}
            {{- include "kubeheal.extraEnv" $ha.extraEnv | nindent 12 }}
          securityContext:
{{ toYaml $g.containerSecurityContext | indent 12 }}
{{- include "kubeheal.resources" $ha.resources | nindent 10 }}
      nodeSelector:
{{ toYaml $g.nodeSelector | indent 8 }}
{{- $sa := .Values.securityAgent }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: security-agent
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels: {app: security-agent}
  template:
    metadata:
      labels: {app: security-agent}
      annotations:
        {{- include "kubeheal.scrapeAnnotations" (dict "port" $sa.metricsPort) | nindent 8 }}
    spec:
      serviceAccountName: security-agent
      hostPID: true          # read /proc/<pid> of every pod (the agent never kills or writes)
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "kubeheal.image" (dict "root" . "image" $sa.image) | quote }}
          imagePullPolicy: {{ $g.imagePullPolicy }}
          ports:
            - {name: metrics, containerPort: {{ $sa.metricsPort }}}
          securityContext:
            privileged: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # SYS_PTRACE: read /proc/<pid>/mem for mmap entropy. DAC_READ_SEARCH: read files across containers.
              add: ["SYS_PTRACE", "DAC_READ_SEARCH"]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PROC_ROOT, value: /proc}
            {{- include "kubeheal.redisEnv" . | nindent 12 }}
            - {name: SECURITY_MODEL_URL, value: "http://{{ .Values.modelServers.security.name }}:{{ .Values.modelServers.security.port }}"}
            # auto | live | off | replay. Replay is an explicit opt-in only (agents/security_agent/falco_client.py).
            - {name: FALCO_MODE, value: {{ $sa.falcoMode | quote }}}
            - {name: FALCO_EVENTS_PATH, value: {{ $sa.falcoEventsPath | quote }}}
            - {name: NAMESPACE, value: {{ $ns | quote }}}
            - {name: LOG_LEVEL, value: {{ $sa.logLevel | quote }}}
            {{- include "kubeheal.extraEnv" $sa.extraEnv | nindent 12 }}
          livenessProbe:
            exec:
              command: ["python", "-c", "import redis,os; redis.from_url(os.environ['REDIS_URL']).ping()"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
{{- include "kubeheal.resources" $sa.resources | nindent 10 }}
          volumeMounts:
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: falco-events, mountPath: /var/run/falco, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: sys
          hostPath: {path: /sys}
        - name: falco-events
          hostPath: {path: /var/run/falco, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {}
      nodeSelector:
{{ toYaml $g.nodeSelector | indent 8 }}
{{- $fu := .Values.fusionAgent }}
---
apiVersion: v1
kind: Service
metadata:
  name: fusion-agent
  namespace: {{ $ns }}
  labels: {app: fusion-agent}
spec:
  ports: [{port: {{ $fu.port }}, targetPort: {{ $fu.port }}, protocol: TCP}]
  selector: {app: fusion-agent}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion-agent
  namespace: {{ $ns }}
spec:
  replicas: {{ $fu.replicas }}
  selector:
    matchLabels: {app: fusion-agent}
  template:
    metadata:
      labels: {app: fusion-agent}
      annotations:
        {{- include "kubeheal.scrapeAnnotations" (dict "port" $fu.port) | nindent 8 }}
    spec:
      serviceAccountName: fusion-agent
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "kubeheal.image" (dict "root" . "image" $fu.image) | quote }}
          imagePullPolicy: {{ $g.imagePullPolicy }}
          ports:
            - {containerPort: {{ $fu.port }}, name: http}
          env:
            {{- include "kubeheal.redisEnv" . | nindent 12 }}
            - {name: LEDGER_BACKEND, value: minio}
            - {name: MINIO_ENDPOINT, value: {{ .Values.minio.endpoint | quote }}}
            - {name: MINIO_BUCKET, value: {{ .Values.minio.bucket | quote }}}
            {{- include "kubeheal.minioClientEnv" (dict "root" .) | nindent 12 }}
            - {name: DCM_URL, value: "http://{{ .Values.modelServers.dcm.name }}:{{ .Values.modelServers.dcm.port }}"}
            - {name: BURN_IN_MODE, value: {{ $fu.burnInMode | quote }}}
            - {name: NAMESPACE, value: {{ $ns | quote }}}
            - {name: LOG_LEVEL, value: {{ $fu.logLevel | quote }}}
            {{- include "kubeheal.extraEnv" $fu.extraEnv | nindent 12 }}
          securityContext:
{{ toYaml $g.containerSecurityContext | indent 12 }}
{{- include "kubeheal.resources" $fu.resources | nindent 10 }}
      nodeSelector:
{{ toYaml $g.nodeSelector | indent 8 }}
{{- $ex := .Values.executor }}
---
# The Executor is the only component with write permissions (RBAC: executor ServiceAccount). It trusts
# every message on the kubeheal.exec stream, hence the Redis password and NetworkPolicy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: {{ $ns }}
  labels: {app: executor}
spec:
  replicas: {{ $ex.replicas }}
  selector:
    matchLabels: {app: executor}
  template:
    metadata:
      labels: {app: executor}
      annotations:
        {{- include "kubeheal.scrapeAnnotations" (dict "port" $ex.metricsPort) | nindent 8 }}
    spec:
      serviceAccountName: executor
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: executor
          image: {{ include "kubeheal.image" (dict "root" . "image" $ex.image) | quote }}
          imagePullPolicy: {{ $g.imagePullPolicy }}
          ports:
            - {name: metrics, containerPort: {{ $ex.metricsPort }}}
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: METRICS_PORT, value: {{ $ex.metricsPort | quote }}}
            {{- include "kubeheal.redisEnv" . | nindent 12 }}
            - {name: EXEC_NAMESPACES, value: {{ $ex.execNamespaces | quote }}}
            - {name: LEDGER_BACKEND, value: minio}
            - {name: MINIO_ENDPOINT, value: {{ .Values.minio.endpoint | quote }}}
            - {name: MINIO_BUCKET, value: {{ .Values.minio.bucket | quote }}}
            {{- include "kubeheal.minioClientEnv" (dict "root" .) | nindent 12 }}
            # Always rendered, taken from executor.env (chosen defaults, not measurements). An empty
            # value is rendered as empty and the Executor then escalates config_missing (fail closed).
            {{- range $name := list "PROMETHEUS_URL" "SNAPSHOT_CLASS" "CANARY_WINDOW_S" "ROLLOUT_TIMEOUT_S" "ROLLOUT_POLL_S" }}
            - {name: {{ $name }}, value: {{ (index (default dict $ex.env) $name) | default "" | toString | quote }}}
            {{- end }}
            {{- include "kubeheal.extraEnv" $ex.extraEnv | nindent 12 }}
          securityContext:
{{ toYaml (merge (deepCopy $ex.securityContext) (deepCopy $g.containerSecurityContext)) | indent 12 }}
          # The Executor has no HTTP health route; the metrics listener starts before the stream loop.
          readinessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
{{- include "kubeheal.resources" $ex.resources | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector:
{{ toYaml $g.nodeSelector | indent 8 }}
{{- $d := .Values.dashboard }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeheal-dashboard
  namespace: {{ $ns }}
  labels: {app: kubeheal-dashboard}
spec:
  ports: [{port: {{ $d.port }}, targetPort: {{ $d.port }}, protocol: TCP}]
  selector: {app: kubeheal-dashboard}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-dashboard
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubeheal-dashboard}
  template:
    metadata:
      labels: {app: kubeheal-dashboard}
      annotations:
        {{- include "kubeheal.scrapeAnnotations" (dict "port" $d.port) | nindent 8 }}
    spec:
      serviceAccountName: dashboard
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ include "kubeheal.image" (dict "root" . "image" $d.image) | quote }}
          imagePullPolicy: {{ $g.imagePullPolicy }}
          ports:
            - {containerPort: {{ $d.port }}, name: http}
          env:
            {{- include "kubeheal.redisEnv" . | nindent 12 }}
            - {name: LOG_LEVEL, value: {{ $d.logLevel | quote }}}
            {{- include "kubeheal.extraEnv" $d.extraEnv | nindent 12 }}
          securityContext:
{{ toYaml $g.containerSecurityContext | indent 12 }}
{{- include "kubeheal.resources" $d.resources | nindent 10 }}
          livenessProbe:
            httpGet: {path: /health, port: {{ $d.port }}}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: {{ $d.port }}}
            initialDelaySeconds: 5
            periodSeconds: 5
      nodeSelector:
{{ toYaml $g.nodeSelector | indent 8 }}
