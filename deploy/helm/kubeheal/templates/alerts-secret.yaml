{{- if .Values.alerts.webhookUrl }}
# Fusion's ALERT_WEBHOOK_URL comes from this Secret (optional key in the Deployment). The URL lands in the Helm
# release record too: for a secret webhook create Secret kubeheal-alerts yourself (docs/operations.md "Alerts").
apiVersion: v1
kind: Secret
metadata:
  name: kubeheal-alerts
  namespace: kubeheal
stringData:
  url: {{ .Values.alerts.webhookUrl | quote }}
{{- end }}
