{{- $name := .Values.containment.hmacSecret.name -}}
{{- $keyName := .Values.containment.hmacSecret.key -}}
{{- $existing := lookup "v1" "Secret" (include "kubeheal.namespace" .) $name -}}
{{- $encoded := "" -}}
{{- if $existing -}}
{{- $encoded = (index ($existing.data | default dict) $keyName) | default "" -}}
{{- if not $encoded -}}
{{- fail (printf "existing Secret %s/%s is missing required key %s; restore the key before upgrading" (include "kubeheal.namespace" .) $name $keyName) -}}
{{- end -}}
{{- else -}}
{{- $encoded = randAlphaNum 64 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "kubeheal.namespace" . }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: containment-auth
type: Opaque
data:
  {{ $keyName }}: {{ $encoded | quote }}
