apiVersion: v1
kind: Service
metadata:
  name: kubeheal-fusion-agent
  namespace: kubeheal
  labels: {app: kubeheal-fusion-agent, kubeheal.io/metrics: "true"}
spec:
  selector: {app: kubeheal-fusion-agent}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-fusion-agent
  namespace: kubeheal
  labels: {app: kubeheal-fusion-agent}
spec:
  replicas: 1
  strategy: {type: Recreate}   # single consumer-group owner; no overlap on rollout
  selector: {matchLabels: {app: kubeheal-fusion-agent}}
  template:
    metadata:
      labels: {app: kubeheal-fusion-agent, kubeheal.io/metrics: "true"}
    spec:
{{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ .Values.priorityClass.name }}
{{- end }}
      serviceAccountName: kubeheal-fusion
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{ .Values.images.agents }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "-m", "agents.fusion_agent.agent"]
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: kubeheal-redis, key: fusion-url}}}   # per-component ACL user (redis.yaml)
            - {name: KUBEHEAL_MODE, value: {{ .Values.mode | quote }}}   # "observe" = dry-run: decide and publish, change nothing
            - {name: CONTAIN_HMAC_KEY, valueFrom: {secretKeyRef: {name: kubeheal-contain-hmac, key: key}}}   # signs/verifies kubeheal.contain entries
            - {name: ALERT_WEBHOOK_URL, valueFrom: {secretKeyRef: {name: kubeheal-alerts, key: url, optional: true}}}   # unset unless Secret kubeheal-alerts exists (docs/operations.md "Alerts")
            - {name: MAX_KILLS_PER_HOUR, value: {{ .Values.fusion.maxKillsPerHour | quote }}}
            - {name: MAX_PATCHES_PER_HOUR, value: {{ .Values.fusion.maxPatchesPerHour | quote }}}
            - {name: EXTRA_PROTECTED_NAMESPACES, value: {{ .Values.extraProtectedNamespaces | quote }}}   # the cluster's Falco and Prometheus namespaces
            - {name: LOG_LEVEL, value: {{ .Values.logLevel | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Sized from kubectl top under lab load (2026-10-17, training/collect/ run): cpu 5m, mem 83Mi peak.
          # requests ~ p95; limits >= 2x requests and >= 1.5x peak; 500m CPU limit keeps Python startup fast.
          resources:
{{- toYaml .Values.fusion.resources | nindent 12 }}
          startupProbe:          # /healthz is served only after Redis answers; give Redis time to start
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:         # tolerant: a slow event-loop tick under load must not restart the agent
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
