apiVersion: v1
kind: Service
metadata:
  name: kubeheal-health-agent
  namespace: kubeheal
  labels: {app: kubeheal-health-agent, kubeheal.io/metrics: "true"}
spec:
  selector: {app: kubeheal-health-agent}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-health-agent
  namespace: kubeheal
  labels: {app: kubeheal-health-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: kubeheal-health-agent}}
  template:
    metadata:
      labels: {app: kubeheal-health-agent, kubeheal.io/metrics: "true"}
    spec:
{{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ .Values.priorityClass.name }}
{{- end }}
      serviceAccountName: kubeheal-health
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{ include "kubeheal.image" (list . .Values.images.agents) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "-m", "agents.health_agent.agent"]
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: kubeheal-redis, key: health-url}}}   # per-component ACL user (redis.yaml)
{{- if .Values.redis.ha.enabled }}
            - {name: REDIS_SENTINELS, value: {{ include "kubeheal.redisSentinels" . | quote }}}
{{- end }}
            - {name: INFERENCE_URL, value: "http://kubeheal-inference.kubeheal.svc:8000"}
            - {name: PROMETHEUS_URL, value: {{ .Values.health.prometheusUrl | quote }}}
            - {name: ASSESS_DELAY_S, value: {{ .Values.health.assessDelayS | quote }}}
            - {name: EXTRA_PROTECTED_NAMESPACES, value: {{ .Values.extraProtectedNamespaces | quote }}}   # the cluster's Falco and Prometheus namespaces
            - {name: LOG_LEVEL, value: {{ .Values.logLevel | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Sized from kubectl top under lab load (2026-10-17, training/collect/ run): cpu 11m, mem 91Mi peak.
          # requests ~ p95; limits >= 2x requests and >= 1.5x peak; 500m CPU limit keeps Python startup fast.
          resources:
{{- toYaml .Values.health.resources | nindent 12 }}
          startupProbe:          # /healthz is served only after Redis answers; give Redis time to start
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:         # tolerant: a slow event-loop tick under load must not restart the agent
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
