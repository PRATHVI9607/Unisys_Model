{{- if .Values.ingress.enabled }}
{{- if not .Values.dashboard.enabled }}{{ fail "ingress.enabled needs dashboard.enabled" }}{{ end }}
{{- if not (and .Values.ingress.host .Values.ingress.tlsSecretName) }}{{ fail "ingress.enabled needs ingress.host and ingress.tlsSecretName: the dashboard is never exposed without TLS" }}{{ end }}
# The dashboard has no login of its own besides the admin token: enable sso (OIDC proxy sidecar) or use your ingress controller's auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeheal-dashboard
  namespace: kubeheal
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubeheal-dashboard
                port: {number: {{ if .Values.sso.enabled }}4180{{ else }}8080{{ end }}}
{{- end }}
