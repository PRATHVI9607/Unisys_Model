{{- /* MinIO ledger store, ported from k8s/minio.yaml. Credentials Secrets are created outside the chart
(scripts/minio_secret.ps1) so no secret value is ever in a values file. */ -}}
{{- if .Values.minio.enabled }}
{{- $ns := include "kubeheal.namespace" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: {{ $ns }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.minio.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate          # one ReadWriteOnce volume
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: minio
          image: {{ include "kubeheal.image" (dict "root" . "image" .Values.minio.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.rootSecret }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.rootSecret }}
                  key: root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
{{ toYaml .Values.global.containerSecurityContext | indent 12 }}
{{- include "kubeheal.resources" .Values.minio.resources | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /data
      nodeSelector:
{{ toYaml .Values.global.nodeSelector | indent 8 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeheal-minio-ledger-policy
  namespace: {{ $ns }}
data:
  ledger-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket", "s3:ListBucketVersions", "s3:GetBucketLocation", "s3:GetBucketVersioning"],
          "Resource": ["arn:aws:s3:::{{ .Values.minio.bucket }}"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject"],
          "Resource": ["arn:aws:s3:::{{ .Values.minio.bucket }}/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: minio-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: configure
          image: {{ include "kubeheal.image" (dict "root" . "image" .Values.minio.mcImage) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              until mc ready local; do sleep 2; done
              mc mb --with-lock --ignore-existing local/{{ .Values.minio.bucket }}
              mc retention set --default COMPLIANCE "$MINIO_RETENTION" local/{{ .Values.minio.bucket }}
              mc admin policy create local kubeheal-ledger-writer /policy/ledger-policy.json
              if ! mc admin user info local "$MINIO_ACCESS_KEY" >/dev/null 2>&1; then
                mc admin user add local "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
              fi
              mc admin policy attach local kubeheal-ledger-writer --user "$MINIO_ACCESS_KEY"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.rootSecret }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.rootSecret }}
                  key: root-password
            {{- include "kubeheal.minioClientEnv" (dict "root" .) | nindent 12 }}
            - name: MINIO_RETENTION
              value: {{ .Values.minio.ledgerRetention | quote }}
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: kubeheal-minio-ledger-policy
{{- end }}
