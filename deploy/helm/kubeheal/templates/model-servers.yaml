{{- /*
P9-H3 / S-CL-1, S-CL-2, S-CL-8: health model, security model and DCM servers.
Each gets a Deployment (replicas from modelServers.replicas, topology spread), a Service, a
PodDisruptionBudget (minAvailable 1) and, depending on hpa.mode, exactly one HPA (min 2, max 8):
queue (default, per-pod in-flight gauge), latency (fallback) or cpu (weaker fallback).
Requests and limits are rendered only when set in values (measure them with eval/resource_profile.py).
*/ -}}
{{- $ms := .Values.modelServers }}
{{- $ns := include "kubeheal.namespace" . }}
{{- range $key := list "health" "security" "dcm" }}
{{- $s := index $ms $key }}
{{- if not (has $s.modelFormat (list "pt" "onnx")) }}{{ fail (printf "modelServers.%s.modelFormat must be pt or onnx" $key) }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
  labels: {app: {{ $s.name }}, version: v4.0.0}
spec:
  replicas: {{ $ms.replicas }}
  selector:
    matchLabels: {app: {{ $s.name }}}
  template:
    metadata:
      labels: {app: {{ $s.name }}}
      annotations:
        {{- include "kubeheal.scrapeAnnotations" (dict "port" $s.port) | nindent 8 }}
    spec:
      serviceAccountName: {{ $s.serviceAccount }}
      {{- include "kubeheal.pullSecrets" $ | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: {{ $ms.topologySpread.maxSkew }}
          topologyKey: {{ $ms.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ $ms.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels: {app: {{ $s.name }}}
      containers:
        - name: {{ $s.name }}-server
          image: {{ include "kubeheal.image" (dict "root" $ "image" $s.image) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - {containerPort: {{ $s.port }}, name: http}
          env:
            - {name: MODEL_FORMAT, value: {{ $s.modelFormat | quote }}}
            - {name: MODEL_PATH, value: {{ $s.modelPath | quote }}}
            {{- if eq $key "dcm" }}
            - {name: MODEL_ONNX_PATH, value: {{ $s.onnxPath | quote }}}
            {{- end }}
            - {name: MODEL_REGISTRY_OBJECT, value: {{ $s.registryObject | quote }}}
            - {name: MODEL_REGISTRY_BUCKET, value: {{ $ms.registryBucket | quote }}}
            - {name: MINIO_ENDPOINT, value: {{ $.Values.minio.endpoint | quote }}}
            {{- include "kubeheal.minioClientEnv" (dict "root" $ "optional" true) | nindent 12 }}
            {{- if hasKey $s "enableShap" }}
            - {name: ENABLE_SHAP, value: {{ $s.enableShap | quote }}}
            {{- end }}
            {{- include "kubeheal.extraEnv" $s.extraEnv | nindent 12 }}
          securityContext:
{{ toYaml $.Values.global.containerSecurityContext | indent 12 }}
{{- include "kubeheal.resources" $s.resources | nindent 10 }}
          startupProbe: {httpGet: {path: /health, port: {{ $s.port }}}, periodSeconds: 5, failureThreshold: 40}
          readinessProbe: {httpGet: {path: /health, port: {{ $s.port }}}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: {{ $s.port }}}, periodSeconds: 15, failureThreshold: 3}
      nodeSelector:
{{ toYaml $.Values.global.nodeSelector | indent 8 }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $s.name }}, namespace: {{ $ns }}}
spec:
  selector: {app: {{ $s.name }}}
  ports: [{port: {{ $s.port }}, targetPort: {{ $s.port }}, name: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
spec:
  minAvailable: {{ $ms.pdb.minAvailable }}
  selector:
    matchLabels: {app: {{ $s.name }}}
{{- if or (eq $.Values.hpa.mode "queue") (eq $.Values.hpa.mode "latency") }}
{{- $mode := $.Values.hpa.mode }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $s.name }}}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    # Pods metric served by prometheus-adapter (rule: ConfigMap kubeheal-prometheus-adapter-rule).
    - type: Pods
      pods:
        metric:
          name: {{ index $.Values.hpa $mode "metricName" }}
        target:
          type: AverageValue
          averageValue: {{ required (printf "hpa.%s.targetAverageValue is required when hpa.mode=%s" $mode $mode) (index $.Values.hpa $mode "targetAverageValue") | quote }}
{{- else if eq $.Values.hpa.mode "cpu" }}
---
# WEAK FALLBACK (hpa.mode=cpu): for clusters without prometheus-adapter. CPU utilisation is computed
# against the container CPU request, so the model server resources.requests.cpu must be set.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $s.name }}}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ required "hpa.cpu.targetAverageUtilization is required when hpa.mode=cpu (owner decision)" $.Values.hpa.cpu.targetAverageUtilization }}
{{- else if ne $.Values.hpa.mode "none" }}
{{- fail "hpa.mode must be queue, latency, cpu or none" }}
{{- end }}
{{- end }}
