{{- /*
P9-H6: Redis with AOF on a PVC and password auth. The Service keeps the name redis-master so the
components' REDIS_URL host does not change. The password comes from a Secret (existing, or created
from redis.auth.password at install time).
*/ -}}
{{- $size := required "redis.persistence.size is required (volume budget is an owner decision)" .Values.redis.persistence.size }}
{{- if .Values.redis.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.auth.existingSecret }}
  namespace: {{ include "kubeheal.namespace" . }}
type: Opaque
stringData:
  {{ .Values.redis.auth.key }}: {{ .Values.redis.auth.password | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.serviceName }}
  namespace: {{ include "kubeheal.namespace" . }}
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ include "kubeheal.namespace" . }}
  labels:
    app: redis
spec:
  serviceName: {{ .Values.redis.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      {{- include "kubeheal.pullSecrets" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "kubeheal.image" (dict "root" . "image" .Values.redis.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # AOF on, password required. $(REDIS_PASSWORD) is expanded by Kubernetes.
          command: ["redis-server"]
          args: ["--appendonly", "yes", "--dir", "/data", "--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret }}
                  key: {{ .Values.redis.auth.key }}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret }}
                  key: {{ .Values.redis.auth.key }}
          securityContext:
{{ toYaml .Values.global.containerSecurityContext | indent 12 }}
          startupProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
            failureThreshold: 60       # AOF replay can be slow after a crash; startup probe gates liveness
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 15
{{- include "kubeheal.resources" .Values.redis.resources | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /data
      nodeSelector:
{{ toYaml .Values.global.nodeSelector | indent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $size | quote }}
