apiVersion: v1
kind: Service
metadata:
  name: kubeheal-dashboard
  namespace: kubeheal
  labels: {app: kubeheal-dashboard}
spec:
  selector: {app: kubeheal-dashboard}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-dashboard
  namespace: kubeheal
  labels: {app: kubeheal-dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: kubeheal-dashboard}}
  template:
    metadata:
      labels: {app: kubeheal-dashboard}
    spec:
      serviceAccountName: kubeheal-dashboard
      automountServiceAccountToken: false   # dashboard reads Redis only, not the K8s API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: kubeheal/dashboard:v5
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: REDIS_URL, value: "redis://redis-master.kubeheal.svc:6379/0"}
            - {name: LOG_LEVEL, value: "INFO"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Sized from kubectl top under lab load (2026-10-17, training/collect/ run): cpu 5m, mem 48Mi peak.
          # requests ~ p95; limits >= 2x requests and >= 1.5x peak; 500m CPU limit keeps Python startup fast.
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
