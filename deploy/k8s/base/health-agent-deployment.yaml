apiVersion: v1
kind: Service
metadata:
  name: kubeheal-health-agent
  namespace: kubeheal
  labels: {app: kubeheal-health-agent, kubeheal.io/metrics: "true"}
spec:
  selector: {app: kubeheal-health-agent}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-health-agent
  namespace: kubeheal
  labels: {app: kubeheal-health-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: kubeheal-health-agent}}
  template:
    metadata:
      labels: {app: kubeheal-health-agent, kubeheal.io/metrics: "true"}
    spec:
      serviceAccountName: kubeheal-health
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: kubeheal/agents:v5
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "agents.health_agent.agent"]
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: REDIS_URL, value: "redis://redis-master.kubeheal.svc:6379/0"}
            - {name: INFERENCE_URL, value: "http://kubeheal-inference.kubeheal.svc:8000"}
            - {name: PROMETHEUS_URL, value: "http://prometheus-operated.monitoring.svc:9090"}
            - {name: ASSESS_DELAY_S, value: "60"}
            - {name: EXTRA_PROTECTED_NAMESPACES, value: "falco,monitoring"}   # the cluster's Falco and Prometheus namespaces
            - {name: LOG_LEVEL, value: "INFO"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Sized from kubectl top under lab load (2026-10-17, training/collect/ run): cpu 11m, mem 91Mi peak.
          # requests ~ p95; limits >= 2x requests and >= 1.5x peak; 500m CPU limit keeps Python startup fast.
          resources:
            requests: {cpu: 15m, memory: 96Mi}
            limits: {cpu: 500m, memory: 192Mi}
          startupProbe:          # /healthz is served only after Redis answers; give Redis time to start
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
