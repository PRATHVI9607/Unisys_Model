apiVersion: v1
kind: Service
metadata:
  name: kubeheal-inference
  namespace: kubeheal
  labels: {app: kubeheal-inference, kubeheal.io/metrics: "true"}
spec:
  selector: {app: kubeheal-inference}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-inference
  namespace: kubeheal
  labels: {app: kubeheal-inference}
spec:
  replicas: 1   # dev/lab; overlays/production runs 2-6 with an HPA
  selector: {matchLabels: {app: kubeheal-inference}}
  template:
    metadata:
      labels: {app: kubeheal-inference}
    spec:
      automountServiceAccountToken: false   # inference never calls the K8s API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: inference
          image: kubeheal.invalid/inference:v5
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: LOG_LEVEL, value: "INFO"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Sized from kubectl top under lab load (2026-10-17, training/collect/ run): cpu 8m, mem 89Mi peak per replica.
          # requests ~ p95; limits >= 2x requests and >= 1.5x peak; 500m CPU limit keeps Python startup fast.
          resources:
            requests: {cpu: 10m, memory: 96Mi}
            limits: {cpu: 500m, memory: 192Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 3
---
# Only the agents that score (health, security) and Prometheus (namespace monitoring, ServiceMonitor kubeheal)
# may reach the model API. kubectl port-forward is not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeheal-inference-clients
  namespace: kubeheal
spec:
  podSelector: {matchLabels: {app: kubeheal-inference}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [kubeheal-health-agent, kubeheal-security-agent]}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{port: 8000}]
