apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Built by deploy/k8s/kustomization.yaml (dev) and deploy/k8s/overlays/production.
# Prometheus and Falco are installed via Helm by deploy/scripts/install.sh with the
# values in deploy/k8s/helm/ (Falco rules: deploy/k8s/falco-kubeheal-rules.yaml, --set-file).
resources:
  - rbac/rbac.yaml          # also declares the kubeheal namespace
  - redis.yaml

  - inference-deployment.yaml
  - health-agent-deployment.yaml
  - security-agent-daemonset.yaml
  - fusion-agent-deployment.yaml
  - dashboard-deployment.yaml
  - prometheus-config.yaml   # ServiceMonitor + PodMonitor; needs the Prometheus Operator CRDs
