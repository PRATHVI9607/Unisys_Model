# KubeHeal data-volume file activity for Falco (--set-file customRules, see
# deploy/k8s/helm/falco-values.yaml). Self-contained: only this file is loaded, so it
# may not use macros from Falco's default rule set (e.g. `container`).
#
# One rule emits every file syscall the security model's features count
# (kubeheal.features.security.CAPTURED_GROUPS: read, write, rename, unlink,
# truncate, chmod) on a data volume. read()/write() are deliberately NOT hooked
# (Falco would process every I/O call on the node); an open's flags
# (%evt.arg.flags) give its read/write intent instead, from a container in a pod. The
# synthetic training windows are cut to exactly this view; the test
# tests/test_features_security.py keeps the evt.type list and CAPTURED_GROUPS in
# sync. Network/exec/mmap syscalls are not captured (the model never sees them).
#
# Output %fields → output_fields keys the agent reads: evt.type, evt.arg.flags (opens), proc.pid,
# fd.name (fd-based calls), fs.path.name (path-based: unlink, chmod, truncate),
# fs.path.source / fs.path.target (rename old/new path), k8s.pod.name, k8s.pod.uid
# (a recreated pod with the same name gets a fresh window), k8s.ns.name, container.id (the agent checks
# proc.pid belongs to this container before reading /proc/<pid>/root for entropy).

# Mount points of the volumes KubeHeal protects (prefix match). Add yours here.
- list: kh_data_dirs
  items: [/data]

# Not the kubeheal namespace: its own Redis writes to /data (an emptyDir) and would feed back into the model.
- macro: kh_in_pod
  condition: (container.id != host and k8s.pod.name exists and k8s.ns.name != kubeheal)

- macro: kh_on_data
  condition: >
    (fd.name pmatch (kh_data_dirs) or fs.path.name pmatch (kh_data_dirs) or
     fs.path.target pmatch (kh_data_dirs))

- rule: KubeHeal Data File Activity
  desc: File opens, renames, unlinks, truncates and permission changes on a data volume
  condition: >
    evt.type in (open, openat, openat2, creat, rename, renameat, renameat2,
                 unlink, unlinkat, truncate, ftruncate,
                 chmod, fchmod, fchmodat)
    and kh_on_data and kh_in_pod
  output: "kubeheal file (evt_type=%evt.type flags=%evt.arg.flags pid=%proc.pid file=%fd.name path=%fs.path.name oldpath=%fs.path.source newpath=%fs.path.target pod=%k8s.pod.name pod_uid=%k8s.pod.uid ns=%k8s.ns.name cid=%container.id)"
  priority: NOTICE
  tags: [kubeheal]
