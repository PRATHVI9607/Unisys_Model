# kube-prometheus-stack, trimmed for a laptop cluster: Prometheus + operator +
# kube-state-metrics + kubelet/cAdvisor only. The health agent needs cAdvisor,
# kube-state-metrics and the app's own /metrics (PodMonitor in
# deploy/k8s/base/prometheus-config.yaml), all scraped every 15 s = METRIC_STEP_S.
# Keep-lists: only the series agents/health_agent/prometheus.py build_queries() reads are
# ingested (lab runs churn hundreds of pods/hour; everything else would fill the 1.5 GiB head).
# Add a metric there → add it to the matching keep regex here (or the PodMonitor).
# Alertmanager: off on a laptop. To get notifications (rules: deploy/k8s/base/alerts/), install with
# `--set alertmanager.enabled=true` and uncomment the receivers you use below; docs/operations.md "Alert routing" has the Secret.
# Receivers are commented out because Alertmanager refuses to start when a referenced secret file is missing.
# Routing: critical -> pager, warning -> chat, info -> chat digest; everything lands in `null` until a receiver is enabled.
alertmanager:
  enabled: false
  alertmanagerSpec:
    secrets: []   # [kubeheal-alertmanager] once you create it: mounted at /etc/alertmanager/secrets/kubeheal-alertmanager/
  config:
    global: {resolve_timeout: 5m}
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - {matchers: ['severity="critical"'], receiver: "null"}   # -> pagerduty
        - {matchers: ['severity="warning"'], receiver: "null"}    # -> slack
        - {matchers: ['severity="info"'], receiver: "null", repeat_interval: 24h}   # -> slack
    receivers:
      - name: "null"
      # - name: slack          # Secret key slack-url: the incoming-webhook URL
      #   slack_configs:
      #     - api_url_file: /etc/alertmanager/secrets/kubeheal-alertmanager/slack-url
      #       channel: "#kubeheal"
      #       send_resolved: true
      #       title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
      #       text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
      # - name: pagerduty      # Secret key pagerduty-key: the Events API v2 integration key
      #   pagerduty_configs:
      #     - routing_key_file: /etc/alertmanager/secrets/kubeheal-alertmanager/pagerduty-key
      #       description: "{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}"
      # - name: email          # Secret key smtp-password
      #   email_configs:
      #     - to: oncall@example.com
      #       from: kubeheal@example.com
      #       smarthost: smtp.example.com:587
      #       auth_username: kubeheal@example.com
      #       auth_password_file: /etc/alertmanager/secrets/kubeheal-alertmanager/smtp-password
# Grafana: only for the KubeHeal dashboard (ConfigMap kubeheal-grafana-dashboard, deploy/k8s/base/grafana/).
# No default dashboards, no Ingress: reach it with `kubectl -n monitoring port-forward svc/monitoring-grafana 3000:80`.
# adminPassword null = the chart generates a random one: kubectl -n monitoring get secret monitoring-grafana -o jsonpath='{.data.admin-password}' | base64 -d
grafana:
  enabled: true
  adminPassword: null
  defaultDashboardsEnabled: false
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard, labelValue: "1", searchNamespace: monitoring}
    datasources: {enabled: true}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 768Mi}   # 13.x is OOMKilled at 256Mi
nodeExporter: {enabled: false}
defaultRules: {create: false}
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
kubeApiServer: {enabled: false}   # ~30k series, nothing queries them
coreDns: {enabled: false}
kubelet:
  serviceMonitor:
    kubelet: false                  # kubelet's own /metrics: unused
    probes: false
    cAdvisorMetricRelabelings:
      - {sourceLabels: [__name__], action: keep,
         regex: "container_cpu_usage_seconds_total|container_cpu_cfs_(throttled_)?periods_total|container_memory_working_set_bytes"}
      - {sourceLabels: [container], action: drop, regex: "|POD"}   # pod/pause cgroups; the agent selects container!=""
kube-state-metrics:
  prometheus:
    monitor:
      metricRelabelings:
        - {sourceLabels: [__name__], action: keep,
           regex: "kube_pod_container_resource_limits|kube_pod_container_status_restarts_total|kube_deployment_spec_replicas|kube_deployment_status_replicas_ready"}
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 6h                   # windows are read within minutes; short head/disk for long lab runs
    # pick up every ServiceMonitor / PodMonitor, not only ones labelled with the release name
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false   # and every PrometheusRule (deploy/k8s/base/alerts/)
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
