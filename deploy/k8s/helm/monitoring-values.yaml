# kube-prometheus-stack, trimmed for a laptop cluster: Prometheus + operator +
# kube-state-metrics + kubelet/cAdvisor only. The health agent needs cAdvisor,
# kube-state-metrics and the app's own /metrics (PodMonitor in
# deploy/k8s/base/prometheus-config.yaml), all scraped every 15 s = METRIC_STEP_S.
# Keep-lists: only the series agents/health_agent/prometheus.py build_queries() reads are
# ingested (lab runs churn hundreds of pods/hour; everything else would fill the 1.5 GiB head).
# Add a metric there → add it to the matching keep regex here (or the PodMonitor).
alertmanager: {enabled: false}
grafana: {enabled: false}
nodeExporter: {enabled: false}
defaultRules: {create: false}
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
kubeApiServer: {enabled: false}   # ~30k series, nothing queries them
coreDns: {enabled: false}
kubelet:
  serviceMonitor:
    kubelet: false                  # kubelet's own /metrics: unused
    probes: false
    cAdvisorMetricRelabelings:
      - {sourceLabels: [__name__], action: keep,
         regex: "container_cpu_usage_seconds_total|container_cpu_cfs_(throttled_)?periods_total|container_memory_working_set_bytes"}
      - {sourceLabels: [container], action: drop, regex: "|POD"}   # pod/pause cgroups; the agent selects container!=""
kube-state-metrics:
  prometheus:
    monitor:
      metricRelabelings:
        - {sourceLabels: [__name__], action: keep,
           regex: "kube_pod_container_resource_limits|kube_pod_container_status_restarts_total|kube_deployment_spec_replicas|kube_deployment_status_replicas_ready"}
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 6h                   # windows are read within minutes; short head/disk for long lab runs
    # pick up every ServiceMonitor / PodMonitor, not only ones labelled with the release name
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
