# CPU-based autoscaling against the right-sized request (10m; lab peak 8m per replica).
# Requires metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kubeheal-inference
  namespace: kubeheal
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: kubeheal-inference}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubeheal-inference
  namespace: kubeheal
spec:
  minAvailable: 1
  selector: {matchLabels: {app: kubeheal-inference}}
