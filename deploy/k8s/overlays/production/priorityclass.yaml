# KubeHeal's own pods (security-agent DaemonSet, fusion, health agent, inference, Redis) outrank ordinary workloads, so the
# kubelet/scheduler evicts or preempts app pods before them under node pressure. Deliberately below
# system-cluster-critical / system-node-critical (2e9+), which stay reserved for the platform.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kubeheal-security
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "KubeHeal control plane (agents, inference, Redis): evicted after ordinary workloads."
