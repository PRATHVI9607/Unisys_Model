apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: kubeheal
  labels: {app: executor}
spec:
  replicas: 1
  selector:
    matchLabels: {app: executor}
  template:
    metadata:
      labels: {app: executor}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: executor
      containers:
        - name: executor
          image: kubeheal/executor:v4
          imagePullPolicy: IfNotPresent
          ports:
            - {name: metrics, containerPort: 9100}
          env:
            - {name: REDIS_URL, value: "redis://redis-master:6379"}
            - name: CONTAIN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeheal-redis
                  key: password
            - {name: EXEC_NAMESPACES, value: "prod,staging,dev"}
            - {name: RESTORE_ENTROPY_IMAGE, value: "kubeheal/executor:v4"}
            - {name: RESTORE_ENTROPY_IMAGE_PULL_SECRETS, value: ""}
            - {name: LEDGER_BACKEND, value: "minio"}
            - {name: MINIO_ENDPOINT, value: "minio:9000"}
            - {name: MINIO_BUCKET, value: "kubeheal-ledger"}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-client
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-client
                  key: secret-key
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
