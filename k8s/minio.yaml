# Single-node MinIO-compatible SILO for the local KubeHeal cluster. The
# maintained fork preserves MinIO's S3 and MINIO_* configuration surfaces.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: kubeheal
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: kubeheal
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: kubeheal
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: docker.io/pgsty/silo:RELEASE.2026-11-09T00-00-00Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-root
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-root
                  key: root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeheal-minio-ledger-policy
  namespace: kubeheal
data:
  ledger-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket", "s3:ListBucketVersions", "s3:GetBucketLocation", "s3:GetBucketVersioning"],
          "Resource": ["arn:aws:s3:::kubeheal-ledger"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject"],
          "Resource": ["arn:aws:s3:::kubeheal-ledger/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: kubeheal
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: minio-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: configure
          image: docker.io/pgsty/mc:RELEASE.2026-11-09T00-00-00Z
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              until mc ready local; do sleep 2; done
              mc mb --with-lock --ignore-existing local/kubeheal-ledger
              mc retention set --default COMPLIANCE "$MINIO_RETENTION" local/kubeheal-ledger
              mc admin policy create local kubeheal-ledger-writer /policy/ledger-policy.json
              if ! mc admin user info local "$MINIO_ACCESS_KEY" >/dev/null 2>&1; then
                mc admin user add local "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
              fi
              mc admin policy attach local kubeheal-ledger-writer --user "$MINIO_ACCESS_KEY"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-root
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-root
                  key: root-password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-client
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeheal-minio-client
                  key: secret-key
            - name: MINIO_RETENTION
              value: 1d
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: kubeheal-minio-ledger-policy
