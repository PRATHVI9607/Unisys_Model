apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: security-agent
  namespace: kubeheal
spec:
  selector:
    matchLabels:
      app: security-agent
  template:
    metadata:
      labels:
        app: security-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: security-agent
      hostPID: true          # read /proc/<pid> of every pod; the agent never writes to Kubernetes or kills a process
      containers:
        - name: agent
          image: kubeheal/security-agent:v4
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          securityContext:
            privileged: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # SYS_PTRACE: read /proc/<pid>/mem for mmap entropy
              # DAC_READ_SEARCH: read files across container boundaries
              add: ["SYS_PTRACE", "DAC_READ_SEARCH"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PROC_ROOT
              value: /proc
            - name: REDIS_URL
              value: redis://redis-master:6379
            - name: CONTAIN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeheal-containment-hmac
                  key: key
            - name: NODE_NAME      # V5-S5: the freeze consumer reads only its own node's stream
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID        # the agent never freezes its own pod (its own cgroup path is 0::/)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CGROUP_ROOT
              value: /host/cgroup
            - name: EXEC_NAMESPACES    # must equal the Executor's
              value: prod,staging,dev
            - name: ENTROPY_THRESHOLD
              value: "7.2"
            - name: MMAP_ENTROPY_THRESHOLD
              value: "7.0"
            - name: WRITE_BYTES_THRESHOLD
              value: "10485760"        # 10 MiB / 2s window
            # Falco input mode: auto (use Falco when its socket or events file exists, otherwise the
            # /proc write-byte tracker only), live, off, or replay (FALCO_REPLAY_PATH, explicit opt-in
            # only: replay never starts from auto because it invents pids and pods).
            # See agents/security_agent/falco_client.py. Falco itself is installed with k8s/falco-values.yaml and the rules file (see scripts/install.sh).
            - name: FALCO_MODE
              value: auto
            - name: FALCO_EVENTS_PATH
              value: /var/run/falco/events.jsonl
            - name: NAMESPACE
              value: kubeheal
            - name: LOG_LEVEL
              value: "INFO"
          livenessProbe:
            exec:
              command: ["python", "-c", "import redis,os; redis.from_url(os.environ['REDIS_URL']).ping()"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: falco-events     # Falco's JSON output (shared, read-only)
              mountPath: /var/run/falco
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: host-cgroup      # V5-S5: READ-WRITE, used only by the cgroup freeze (containment.py)
              mountPath: /host/cgroup
      volumes:
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: sys
          hostPath:
            path: /sys
        - name: falco-events
          hostPath:
            path: /var/run/falco
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
      nodeSelector:
        kubernetes.io/arch: amd64
