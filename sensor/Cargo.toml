[package]
name = "kubeheal-sensor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
libbpf-rs = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
libc = "0.2"
libbpf-sys = "1.5"   # already a libbpf-rs dependency; bpf_prog_get_info_by_fd for recursion misses

[build-dependencies]
libbpf-cargo = "0.25"

[profile.release]
opt-level = 3
lto = true
strip = true
